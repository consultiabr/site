# .github/workflows/pages.yml
name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"   # diário, 06:00 em Brasília: atualiza a lista de projetos
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar lista de projetos
        run: node scripts/gerar-projetos.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: consultiabr
          TOPIC: consultia-projeto
      - name: Montar pasta de publicação
        run: |
          mkdir -p _site
          cp index.html CNAME _site/
          cp public/projects.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
